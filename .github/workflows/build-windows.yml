name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "사진관리" iCloud_사진_자동정리.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 사진관리-Windows-EXE
          path: dist/사진관리.exe
