name: Build Photo Organizer V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v2.txt

      - name: Install ExifTool
        shell: powershell
        run: |
          choco install exiftool -y

          $cmd = Get-Command exiftool.exe -ErrorAction SilentlyContinue

          if ($cmd) {
            $source = $cmd.Source
          }
          else {
            $source = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -eq "exiftool.exe" -or
                $_.Name -eq "exiftool(-k).exe"
              } |
              Select-Object -First 1 |
              ForEach-Object { $_.FullName }
          }

          if (-not $source) {
            throw "ExifTool executable not found."
          }

          Write-Host "ExifTool source:"
          Write-Host $source

          Copy-Item $source ".\exiftool.exe" -Force

          Write-Host "Testing copied ExifTool..."
          & ".\exiftool.exe" -ver

          if ($LASTEXITCODE -ne 0) {
            throw "Copied ExifTool failed to execute."
          }

      - name: Build EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PhotoOrganizerV2 `
            --add-binary "exiftool.exe;." `
            --collect-all PIL `
            photo_organizer_v2.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist\PhotoOrganizerV2.exe")) {
            throw "PhotoOrganizerV2.exe was not created."
          }

          Write-Host "PhotoOrganizerV2.exe build verified."
          Get-Item "dist\PhotoOrganizerV2.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoOrganizerV2-2-Windows-EXE
          path: dist/PhotoOrganizerV2.exe
          if-no-files-found: error
