name: Build Photo Organizer V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v2.txt

      - name: Install ExifTool
        shell: powershell
        run: |
          choco install exiftool -y

          $root = "C:\ProgramData\chocolatey\lib\exiftool\tools"

          $exe = Get-ChildItem $root -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Name -eq "exiftool.exe" -or $_.Name -eq "exiftool(-k).exe" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "ExifTool executable not found."
          }

          Write-Host "ExifTool found at:"
          Write-Host $exe.FullName

          Copy-Item $exe.FullName ".\exiftool.exe" -Force

          $files = Get-ChildItem $root -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "exiftool_files" } |
            Select-Object -First 1

          if ($files) {
            Copy-Item $files.FullName ".\exiftool_files" -Recurse -Force
            Write-Host "exiftool_files copied."
          }

          & ".\exiftool.exe" -ver

      - name: Build EXE
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PhotoOrganizerV2 --add-binary "exiftool.exe;." photo_organizer_v2.py

          if (Test-Path ".\exiftool_files") {
            Remove-Item -Recurse -Force ".\dist\PhotoOrganizerV2" -ErrorAction SilentlyContinue
            Write-Host "ExifTool support files detected."
          }

      - name: Verify EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist\PhotoOrganizerV2.exe")) {
            throw "PhotoOrganizerV2.exe was not created."
          }
          Write-Host "PhotoOrganizerV2.exe build verified."
          Get-Item "dist\PhotoOrganizerV2.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoOrganizerV2-Windows-EXE
          path: dist/PhotoOrganizerV2.exe
          if-no-files-found: error
