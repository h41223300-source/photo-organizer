name: Build Photo Organizer V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_v2.txt

      - name: Install ExifTool
        shell: powershell
        run: |
          choco install exiftool -y
          $exe = Get-Command exiftool.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            $exe = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -Filter "exiftool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            throw "ExifTool installation failed"
          }
          Copy-Item $exe.Source "exiftool.exe" -Force
          & ".\exiftool.exe" -ver

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "사진관리_V2" --add-binary "exiftool.exe;." photo_organizer_v2.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 사진관리-V2-Windows-EXE
          path: dist/사진관리_V2.exe
